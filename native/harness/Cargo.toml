[package]
name = "reforge-harness"
description = "Offline test harness that loads reforge.dll inside a fake Darktide folder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_IO",
] }
